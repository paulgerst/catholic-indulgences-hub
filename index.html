<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catholic Indulgences Hub</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; background-color: #f4f6f8; color: #2c3e50; }
    h1 { color: #5c1d24; text-align: center; margin-bottom: 8px; }
    p.subtitle { text-align: center; color: #666; margin-top: 0; margin-bottom: 30px; }
    
    /* Controls Area */
    .controls { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
    .search-input { flex: 2; min-width: 200px; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1em; }
    .filter-select { flex: 1; min-width: 140px; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1em; background-color: white; }
    
    /* Card Styling */
    .card { background: white; padding: 22px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 3px 6px rgba(0,0,0,0.08); border-left: 6px solid #5c1d24; }
    .card-header { display: flex; justify-content: space-between; align-items: baseline; }
    .card h2 { margin: 0 0 10px 0; font-size: 1.3em; color: #1a1a1a; }
    .badge { background: #5c1d24; color: white; padding: 4px 10px; border-radius: 12px; font-size: 0.75em; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; }
    .norm { font-style: italic; color: #7f8c8d; font-size: 0.9em; margin-bottom: 15px; }
    .conditions { background-color: #fcf8f2; padding: 12px 15px; border-radius: 6px; border: 1px solid #f0e6d6; margin-top: 15px; }
    .conditions h4 { margin: 0 0 8px 0; font-size: 0.9em; color: #8a6d3b; text-transform: uppercase; }
    .conditions ul { margin: 0; padding-left: 20px; font-size: 0.9em; }
    .no-results { text-align: center; color: #7f8c8d; font-size: 1.1em; padding: 40px; }
  </style>
</head>
<body>

  <h1>✝️ Catholic Indulgences Hub</h1>
  <p class="subtitle">A searchable reference for Catholic indulgences and norms</p>

  <div class="controls">
    <input type="text" id="searchInput" class="search-input" placeholder="Search by keyword (e.g., Rosary, Cemetery)...">
    <select id="typeFilter" class="filter-select">
      <option value="ALL">All Types</option>
      <option value="Plenary">Plenary</option>
      <option value="Partial">Partial</option>
    </select>
  </div>

  <div id="indulgencesContainer">Loading indulgences...</div>

  <script>
    let allIndulgences = [];

    // Fetch JSON Data
    fetch('data/indulgences.json')
      .then(response => response.json())
      .then(data => {
        allIndulgences = data;
        renderIndulgences(allIndulgences);
      })
      .catch(err => {
        document.getElementById('indulgencesContainer').innerText = 'Error loading indulgence records.';
      });

    // Render Indulgences to HTML
    function renderIndulgences(items) {
      const container = document.getElementById('indulgencesContainer');
      container.innerHTML = '';

      if (items.length === 0) {
        container.innerHTML = '<div class="no-results">No matching indulgences found.</div>';
        return;
      }

      items.forEach(item => {
        const conditionsList = item.general_conditions 
          ? item.general_conditions.map(c => `<li>${c}</li>`).join('')
          : '<li>Standard conditions apply</li>';

        container.innerHTML += `
          <div class="card">
            <div class="card-header">
              <h2>${item.title}</h2>
              <span class="badge">${item.type}</span>
            </div>
            <div class="norm">Norm: ${item.norm_number || 'N/A'} | Scope: ${item.scope}</div>
            <p>${item.description}</p>
            <div class="conditions">
              <h4>General Conditions Required:</h4>
              <ul>${conditionsList}</ul>
            </div>
          </div>
        `;
      });
    }

    // Filter Logic
    function filterData() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const selectedType = document.getElementById('typeFilter').value;

      const filtered = allIndulgences.filter(item => {
        const matchesSearch = item.title.toLowerCase().includes(searchTerm) || 
                              item.description.toLowerCase().includes(searchTerm) ||
                              item.work_required.toLowerCase().includes(searchTerm);
        
        const matchesType = (selectedType === 'ALL') || (item.type === selectedType);

        return matchesSearch && matchesType;
      });

      renderIndulgences(filtered);
    }

    // Attach Event Listeners
    document.getElementById('searchInput').addEventListener('input', filterData);
    document.getElementById('typeFilter').addEventListener('change', filterData);
  </script>

</body>
</html>
